<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mandarin · HSK1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .app {
            max-width: 650px;
            width: 100%;
            background: transparent;
            position: relative;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .desktop-buttons {
            display: none;
            gap: 0.75rem;
        }

        .desktop-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
            color: #333;
        }

        .desktop-btn:active {
            transform: scale(0.96);
        }

        .desktop-btn.good {
            background: #e0e8e0;
            border-color: #aaa;
        }

        .desktop-btn.bad {
            background: #f0e0e0;
            border-color: #aaa;
        }

        @media (min-width: 769px) {
            .desktop-buttons {
                display: flex;
            }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            color: #666;
            padding: 0 0.2rem;
            background: #f5f5f5;
            border-radius: 60px;
            padding: 0.4rem 1rem;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .pinyin-toggle {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            transition: 0.1s;
            background: #e0e0e0;
            color: #333;
        }

        .pinyin-toggle.active {
            background: #333;
            color: white;
        }

        .pinyin-toggle.inactive {
            background: #ccc;
            color: #888;
        }

        .param-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
            color: #555;
        }

        .card-zone {
            position: relative;
            touch-action: pan-y pinch-zoom;
        }

        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #ddd;
            cursor: pointer;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .swipe-indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 0;
            background-color: transparent;
            transition: width 0.02s linear;
            z-index: 2;
            pointer-events: none;
            border-radius: 32px;
        }

        .swipe-left {
            left: 0;
            background: rgba(200, 70, 60, 0.6);
        }

        .swipe-right {
            right: 0;
            background: rgba(60, 150, 80, 0.6);
        }

        .chinese {
            font-size: 3.2rem;
            font-weight: 460;
            color: #111;
            letter-spacing: 2px;
            font-family: 'PingFang SC', 'Noto Sans CJK SC', system-ui;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .pinyin-top {
            font-size: 1rem;
            color: #888;
            font-weight: 400;
            margin-bottom: 1.2rem;
        }

        .definition {
            font-size: 1.1rem;
            font-weight: 430;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 1.2rem;
            width: 100%;
            margin-top: 0.3rem;
            min-height: 80px;
            line-height: 1.6;
        }

        .definition-line {
            margin-bottom: 0.3rem;
        }

        .pinyin-def {
            color: #888;
            font-size: 1rem;
        }

        .meaning-def {
            color: #444;
            font-size: 1.1rem;
        }

        /* MENU PARAMETRAGE (slide from bottom) */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .settings-overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 28px 28px 0 0;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1001;
            padding: 1.5rem;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }

        .settings-panel.visible {
            transform: translateY(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eee;
        }

        .settings-header h3 {
            font-weight: 500;
            color: #333;
        }

        .close-settings {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .skill-item {
            display: flex;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 0.5px solid #f0f0f0;
        }

        .skill-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 1rem;
            cursor: pointer;
        }

        .skill-name {
            flex: 1;
            font-size: 0.9rem;
            color: #333;
        }

        .skill-count {
            font-size: 0.7rem;
            color: #888;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            visibility: hidden;
            opacity: 0;
            transition: 0.1s;
        }

        .modal.visible {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 88%;
            border-radius: 28px;
            padding: 1.6rem;
            border: 1px solid #ddd;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            font-weight: 500;
            color: #333;
            font-size: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid #888;
            padding-left: 0.7rem;
        }

        .lesson-section {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .lesson-label {
            font-weight: 600;
            color: #666;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .lesson-value {
            color: #2a2a2a;
        }

        .example-trans {
            margin-top: 0.3rem;
            font-style: italic;
            color: #555;
            border-left: 2px solid #ccc;
            padding-left: 0.6rem;
        }

        .close-modal {
            background: none;
            border: 1px solid #ccc;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            margin-top: 0.8rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: #555;
            width: 100%;
        }

        .reset-area {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .reset-btn {
            background: none;
            border: none;
            font-size: 0.7rem;
            color: #888;
            padding: 0.3rem 1rem;
            cursor: pointer;
            border-radius: 60px;
        }

        @media (max-width: 550px) {
            .chinese { font-size: 2.6rem; }
            .definition { font-size: 0.95rem; }
            .card { min-height: 380px; padding: 1.5rem; }
            .stats { font-size: 0.7rem; }
            .pinyin-toggle { font-size: 0.7rem; padding: 0.2rem 0.7rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <button class="param-btn" id="settingsBtn">paramétrage</button>
        <div class="desktop-buttons" id="desktopButtons">
            <button class="desktop-btn bad" id="desktopBadBtn">je ne sais pas</button>
            <button class="desktop-btn good" id="desktopGoodBtn">je sais</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">à réviser <span id="statRemaining">0</span></div>
        <button class="pinyin-toggle active" id="pinyinToggleBtn">pinyin</button>
        <div class="stat-item">connus <span id="statKnown">0</span></div>
    </div>

    <div class="card-zone" id="cardZone">
        <div class="card" id="card">
            <div class="swipe-indicator swipe-left" id="swipeLeftIndicator"></div>
            <div class="swipe-indicator swipe-right" id="swipeRightIndicator"></div>
            <div class="chinese" id="chineseText">-</div>
            <div class="pinyin-top" id="pinyinTop"></div>
            <div class="definition" id="definitionContainer">
                <div class="definition-line" id="pinyinDefLine" style="display: none;"></div>
                <div class="definition-line" id="meaningDefLine"></div>
            </div>
        </div>
    </div>
</div>

<!-- MENU PARAMETRAGE (slide from bottom) -->
<div id="settingsOverlay" class="settings-overlay">
    <div id="settingsPanel" class="settings-panel">
        <div class="settings-header">
            <h3>choisir les skills</h3>
            <button class="close-settings" id="closeSettingsBtn">✕</button>
        </div>
        <div class="skill-list" id="skillList"></div>
        <div class="reset-area" style="margin-top: 1rem;">
            <button class="reset-btn" id="resetProgressBtn">réinitialiser toute progression</button>
        </div>
    </div>
</div>

<!-- MODAL LEÇON -->
<div id="lessonModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">leçon</h3>
        <div class="lesson-section">
            <div class="lesson-label">décomposition</div>
            <div class="lesson-value" id="modalDecomp">-</div>
        </div>
        <div class="lesson-section">
            <div class="lesson-label">mnémonique</div>
            <div class="lesson-value" id="modalMnemonic">-</div>
        </div>
        <div class="lesson-section">
            <div class="lesson-label">phrase d'exemple</div>
            <div class="lesson-value" id="modalExample">-</div>
            <div class="example-trans" id="modalExampleTrans"></div>
        </div>
        <div class="lesson-section" id="tipSection" style="display: none;">
            <div class="lesson-label">astuce</div>
            <div class="lesson-value" id="modalTip">-</div>
        </div>
        <button class="close-modal" id="closeModalBtn">fermer</button>
    </div>
</div>

                { hanzi: "咖啡", pinyin: "kā fēi", meaning: "café", decomposition: "咖 (kā) = 口 (kǒu) + 加 (jiā) ; 啡 (fēi) = 口 (kǒu) + 非 (fēi)", mnemonic: "Emprunt phonétique à l'anglais 'coffee'", example: "我想喝咖啡。", exampleTrans: "Je veux boire du café.", tip: "Mot composé de deux caractères, aucun sens littéral" },

    // Construction de la liste complète des cartes à partir des skills actifs
    let allCards = [];
    let activeSkills = { 1: true };  // skill 1 actif par défaut
    let cards = [];
    let currentIndex = 0;
    let pinyinMode = true;
    let definitionVisible = false;
    let longPressTimer = null;
    let isLongPressTriggered = false;
    let isMouseDown = false;
    let mouseDownX = 0;
    let touchStartX = 0;
    let touchCurrentX = 0;
    let isSwiping = false;

    // DOM
    const chineseEl = document.getElementById('chineseText');
    const pinyinTop = document.getElementById('pinyinTop');
    const pinyinDefLine = document.getElementById('pinyinDefLine');
    const meaningDefLine = document.getElementById('meaningDefLine');
    const cardEl = document.getElementById('card');
    const cardZone = document.getElementById('cardZone');
    const pinyinToggleBtn = document.getElementById('pinyinToggleBtn');
    const statRemainingSpan = document.getElementById('statRemaining');
    const statKnownSpan = document.getElementById('statKnown');
    const swipeLeftIndicator = document.getElementById('swipeLeftIndicator');
    const swipeRightIndicator = document.getElementById('swipeRightIndicator');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const skillListEl = document.getElementById('skillList');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const modal = document.getElementById('lessonModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalDecomp = document.getElementById('modalDecomp');
    const modalMnemonic = document.getElementById('modalMnemonic');
    const modalExample = document.getElementById('modalExample');
    const modalExampleTrans = document.getElementById('modalExampleTrans');
    const modalTip = document.getElementById('modalTip');
    const tipSection = document.getElementById('tipSection');
    const desktopGoodBtn = document.getElementById('desktopGoodBtn');
    const desktopBadBtn = document.getElementById('desktopBadBtn');

    // Construire la liste des cartes à partir des skills actifs
    function buildCardList() {
        allCards = [];
        for (const [skillId, isActive] of Object.entries(activeSkills)) {
            if (isActive && SKILLS[skillId]) {
                const skillVocab = SKILLS[skillId].vocab;
                for (let i = 0; i < skillVocab.length; i++) {
                    allCards.push({
                        id: `${skillId}_${i}`,
                        skillId: parseInt(skillId),
                        data: skillVocab[i],
                        known: false,
                        dueForReview: true
                    });
                }
            }
        }
    }

    // Charger progression depuis localStorage
    function loadProgress() {
        const stored = localStorage.getItem('mandarin_hsk1_progress');
        if (stored) {
            try {
                const progress = JSON.parse(stored);
                for (let i = 0; i < cards.length; i++) {
                    const found = progress.find(p => p.id === cards[i].id);
                    if (found) {
                        cards[i].known = found.known;
                        cards[i].dueForReview = found.dueForReview;
                    }
                }
            } catch(e) {}
        }
    }

    function saveProgress() {
        const toSave = cards.map(c => ({ id: c.id, known: c.known, dueForReview: c.dueForReview }));
        localStorage.setItem('mandarin_hsk1_progress', JSON.stringify(toSave));
        localStorage.setItem('mandarin_hsk1_activeSkills', JSON.stringify(activeSkills));
    }

    function init() {
        buildCardList();
        cards = [...allCards];
        const storedSkills = localStorage.getItem('mandarin_hsk1_activeSkills');
        if (storedSkills) {
            try {
                const saved = JSON.parse(storedSkills);
                activeSkills = saved;
                buildCardList();
                cards = [...allCards];
            } catch(e) {}
        }
        loadProgress();
        currentIndex = 0;
        definitionVisible = false;
        renderSkillList();
        loadCurrentCard();
    }

    function renderSkillList() {
        skillListEl.innerHTML = '';
        for (const [skillId, skill] of Object.entries(SKILLS)) {
            const isActive = activeSkills[skillId] || false;
            const div = document.createElement('div');
            div.className = 'skill-item';
            div.innerHTML = `
                <input type="checkbox" class="skill-checkbox" data-skill="${skillId}" ${isActive ? 'checked' : ''}>
                <span class="skill-name">${skill.name}</span>
                <span class="skill-count">${skill.vocab.length} mots</span>
            `;
            skillListEl.appendChild(div);
        }
        // Attacher événements
        document.querySelectorAll('.skill-checkbox').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const skillId = parseInt(e.target.dataset.skill);
                activeSkills[skillId] = e.target.checked;
                saveProgress();
                rebuildFromSkills();
            });
        });
    }

    function rebuildFromSkills() {
        buildCardList();
        const oldCards = cards;
        cards = [...allCards];
        // Préserver la progression des cartes qui existent déjà
        for (let i = 0; i < cards.length; i++) {
            const oldCard = oldCards.find(c => c.id === cards[i].id);
            if (oldCard) {
                cards[i].known = oldCard.known;
                cards[i].dueForReview = oldCard.dueForReview;
            }
        }
        saveProgress();
        currentIndex = 0;
        definitionVisible = false;
        loadCurrentCard();
    }

    function getReviewQueue() {
        return cards.filter(c => c.dueForReview === true);
    }

    function updateStats() {
        const queue = getReviewQueue();
        statRemainingSpan.innerText = queue.length;
        statKnownSpan.innerText = cards.filter(c => c.known === true).length;
    }

    function loadCurrentCard() {
        const queue = getReviewQueue();
        if (queue.length === 0) {
            chineseEl.innerText = "terminé";
            pinyinTop.innerText = "";
            pinyinDefLine.innerText = "";
            meaningDefLine.innerText = "tout est révisé, modifie les paramètres pour ajouter des mots";
            definitionVisible = false;
            updateStats();
            return;
        }
        if (currentIndex >= queue.length) currentIndex = 0;
        const cardObj = queue[currentIndex];
        const data = cardObj.data;
        chineseEl.innerText = data.hanzi;

        if (pinyinMode) {
            pinyinTop.innerText = data.pinyin;
            pinyinTop.style.display = 'block';
            pinyinDefLine.style.display = 'none';
            pinyinToggleBtn.classList.add('active');
            pinyinToggleBtn.classList.remove('inactive');
        } else {
            pinyinTop.innerText = '';
            pinyinTop.style.display = 'block';
            pinyinDefLine.style.display = 'block';
            pinyinToggleBtn.classList.remove('active');
            pinyinToggleBtn.classList.add('inactive');
        }

        if (!definitionVisible) {
            meaningDefLine.innerText = '';
            if (!pinyinMode) pinyinDefLine.innerText = '';
        } else {
            meaningDefLine.innerText = data.meaning;
            if (!pinyinMode) pinyinDefLine.innerText = data.pinyin;
        }

        updateStats();
    }

    function markAsKnown() {
        const queue = getReviewQueue();
        if (queue.length === 0) return;
        const currentCardObj = queue[currentIndex];
        const originalCard = cards.find(c => c.id === currentCardObj.id);
        if (originalCard) {
            originalCard.known = true;
            originalCard.dueForReview = false;
        }
        saveProgress();
        const newQueue = getReviewQueue();
        if (currentIndex >= newQueue.length) currentIndex = 0;
        definitionVisible = false;
        loadCurrentCard();
    }

    function markAsUnknown() {
        const queue = getReviewQueue();
        if (queue.length === 0) return;
        const currentCardObj = queue[currentIndex];
        const originalCard = cards.find(c => c.id === currentCardObj.id);
        if (originalCard) {
            originalCard.known = false;
            originalCard.dueForReview = true;
        }
        saveProgress();
        const newQueue = getReviewQueue();
        if (newQueue.length > 1) {
            const moved = newQueue[currentIndex];
            const filtered = newQueue.filter((_, idx) => idx !== currentIndex);
            filtered.push(moved);
            const idsOrder = filtered.map(c => c.id);
            const newCardsOrder = [];
            for (let id of idsOrder) {
                const found = cards.find(c => c.id === id);
                if (found) newCardsOrder.push(found);
            }
            const knownCards = cards.filter(c => c.known === true && !c.dueForReview);
            cards = [...newCardsOrder, ...knownCards];
            saveProgress();
            currentIndex = 0;
        }
        definitionVisible = false;
        loadCurrentCard();
    }

    function hideSwipeIndicators() {
        swipeLeftIndicator.style.width = '0px';
        swipeRightIndicator.style.width = '0px';
    }

    function showLessonModal() {
        const queue = getReviewQueue();
        if (queue.length === 0) return;
        const cardObj = queue[currentIndex];
        const d = cardObj.data;
        modalTitle.innerText = d.hanzi + ' · leçon';
        modalDecomp.innerText = d.decomposition || '-';
        modalMnemonic.innerText = d.mnemonic || '-';
        modalExample.innerText = d.example || '-';
        modalExampleTrans.innerText = d.exampleTrans || '-';
        if (d.tip && d.tip.trim() !== '') {
            modalTip.innerText = d.tip;
            tipSection.style.display = 'block';
        } else {
            tipSection.style.display = 'none';
        }
        modal.classList.add('visible');
    }

    // TOUCH / SWIPE
    function onTouchStart(e) {
        e.preventDefault();
        const rect = cardZone.getBoundingClientRect();
        const touch = e.touches[0];
        touchStartX = touch.clientX - rect.left;
        isSwiping = true;
        touchCurrentX = touchStartX;
        longPressTimer = setTimeout(() => {
            isLongPressTriggered = true;
            showLessonModal();
        }, 500);
    }

    function onTouchMove(e) {
        if (!isSwiping) return;
        e.preventDefault();
        const rect = cardZone.getBoundingClientRect();
        const touch = e.touches[0];
        const currentX = touch.clientX - rect.left;
        touchCurrentX = currentX;
        const deltaX = currentX - touchStartX;
        if (longPressTimer) clearTimeout(longPressTimer);
        if (deltaX > 8) {
            swipeRightIndicator.style.width = Math.min(0.5, deltaX / 150) * 80 + 'px';
            swipeLeftIndicator.style.width = '0px';
        } else if (deltaX < -8) {
            swipeLeftIndicator.style.width = Math.min(0.5, Math.abs(deltaX) / 150) * 80 + 'px';
            swipeRightIndicator.style.width = '0px';
        } else {
            hideSwipeIndicators();
        }
    }

    function onTouchEnd(e) {
        if (longPressTimer) clearTimeout(longPressTimer);
        if (isLongPressTriggered) {
            isLongPressTriggered = false;
            isSwiping = false;
            hideSwipeIndicators();
            return;
        }
        if (!isSwiping) return;
        e.preventDefault();
        const deltaX = touchCurrentX - touchStartX;
        if (Math.abs(deltaX) > 40) {
            if (deltaX > 0) markAsKnown();
            else markAsUnknown();
        }
        isSwiping = false;
        hideSwipeIndicators();
    }

    // MOUSE
    function onMouseDown(e) {
        e.preventDefault();
        isMouseDown = true;
        mouseDownX = e.clientX;
        longPressTimer = setTimeout(() => {
            if (isMouseDown) {
                isLongPressTriggered = true;
                showLessonModal();
            }
        }, 500);
    }

    function onMouseMove(e) {
        if (!isMouseDown) return;
        if (longPressTimer) clearTimeout(longPressTimer);
        const deltaX = e.clientX - mouseDownX;
        if (deltaX > 20) {
            hideSwipeIndicators();
            markAsKnown();
            isMouseDown = false;
        } else if (deltaX < -20) {
            hideSwipeIndicators();
            markAsUnknown();
            isMouseDown = false;
        }
    }

    function onMouseUp(e) {
        if (longPressTimer) clearTimeout(longPressTimer);
        if (!isLongPressTriggered && isMouseDown) {
            const deltaX = e.clientX - mouseDownX;
            if (Math.abs(deltaX) < 10) {
                onCardClick();
            }
        }
        isLongPressTriggered = false;
        isMouseDown = false;
        hideSwipeIndicators();
    }

    function onCardClick() {
        const queue = getReviewQueue();
        if (queue.length === 0) return;
        definitionVisible = !definitionVisible;
        loadCurrentCard();
    }

    function togglePinyinMode() {
        pinyinMode = !pinyinMode;
        definitionVisible = false;
        loadCurrentCard();
    }

    function resetAllProgress() {
        for (let i = 0; i < cards.length; i++) {
            cards[i].known = false;
            cards[i].dueForReview = true;
        }
        saveProgress();
        currentIndex = 0;
        definitionVisible = false;
        loadCurrentCard();
    }

    function openSettings() {
        renderSkillList();
        settingsOverlay.classList.add('visible');
        settingsPanel.classList.add('visible');
    }

    function closeSettings() {
        settingsOverlay.classList.remove('visible');
        settingsPanel.classList.remove('visible');
    }

    function bindEvents() {
        cardZone.addEventListener('touchstart', onTouchStart, { passive: false });
        cardZone.addEventListener('touchmove', onTouchMove, { passive: false });
        cardZone.addEventListener('touchend', onTouchEnd);
        cardEl.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        pinyinToggleBtn.addEventListener('click', togglePinyinMode);
        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings(); });
        resetProgressBtn.addEventListener('click', () => { resetAllProgress(); closeSettings(); });
        closeModalBtn.addEventListener('click', () => modal.classList.remove('visible'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('visible'); });
        if (desktopGoodBtn) desktopGoodBtn.addEventListener('click', () => markAsKnown());
        if (desktopBadBtn) desktopBadBtn.addEventListener('click', () => markAsUnknown());
    }

    function start() {
        bindEvents();
        init();
    }

    start();
</script>
</body>
</html>
