<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HSK1 Flash">
<title>HSK1 Flashcards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { height: 100%; background: #000; overflow: hidden; }
.app { background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: background 0.3s; }
.app.light { background: #fff; }
.menu { width: 100%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; padding: 60px 24px 32px; -webkit-overflow-scrolling: touch; }
.menu-title { font-size: 22px; font-weight: 500; color: #fff; margin-bottom: 6px; }
.app.light .menu-title { color: #000; }
.menu-sub { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 28px; }
.app.light .menu-sub { color: rgba(0,0,0,0.35); }
.lesson-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 0.5px solid rgba(255,255,255,0.07); cursor: pointer; }
.app.light .lesson-row { border-color: rgba(0,0,0,0.07); }
.lesson-row:last-of-type { border-bottom: none; }
.lesson-info { display: flex; flex-direction: column; gap: 3px; }
.lesson-name { font-size: 15px; color: #fff; }
.app.light .lesson-name { color: #000; }
.lesson-theme { font-size: 11px; color: rgba(255,255,255,0.4); }
.app.light .lesson-theme { color: rgba(0,0,0,0.35); }
.lesson-count { font-size: 11px; color: rgba(255,255,255,0.25); }
.app.light .lesson-count { color: rgba(0,0,0,0.25); }
.checkbox { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.app.light .checkbox { border-color: rgba(0,0,0,0.2); }
.checkbox.checked { background: #27ae60; border-color: #27ae60; }
.checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; }
.menu-footer { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
.start-btn { background: #27ae60; border: none; color: #fff; padding: 16px; border-radius: 14px; font-size: 16px; cursor: pointer; -webkit-appearance: none; }
.start-btn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.2); }
.app.light .start-btn:disabled { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.2); }
.select-all-btn { background: none; border: 0.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); padding: 12px; border-radius: 14px; font-size: 13px; cursor: pointer; }
.app.light .select-all-btn { border-color: rgba(0,0,0,0.15); color: rgba(0,0,0,0.4); }
.top-bar { position: absolute; top: env(safe-area-inset-top, 16px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; z-index: 10; }
.counter { font-size: 12px; color: rgba(255,255,255,0.3); }
.app.light .counter { color: rgba(0,0,0,0.25); }
.top-right { display: flex; gap: 10px; align-items: center; }
.theme-toggle { background: none; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; }
.app.light .theme-toggle { border-color: rgba(0,0,0,0.15); color: rgba(0,0,0,0.4); }
.menu-btn { background: none; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; }
.app.light .menu-btn { border-color: rgba(0,0,0,0.15); color: rgba(0,0,0,0.4); }
.game { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
.game.active { display: flex; }
.card-area { position: relative; width: min(340px, 90vw); height: min(420px, 55vh); }
.card { position: absolute; inset: 0; background: #111; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); will-change: transform; }
.app.light .card { background: #f4f4f4; border-color: rgba(0,0,0,0.05); }
.lesson-badge { position: absolute; top: 14px; left: 14px; font-size: 10px; color: rgba(255,255,255,0.2); }
.app.light .lesson-badge { color: rgba(0,0,0,0.18); }
.difficulty { position: absolute; top: 14px; right: 14px; display: flex; gap: 4px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.12); }
.app.light .dot { background: rgba(0,0,0,0.1); }
.dot.active { background: #c0392b; }
.char { font-size: clamp(64px, 18vw, 90px); font-weight: 300; line-height: 1; color: #fff; margin-bottom: 24px; pointer-events: none; text-align: center; padding: 0 16px; }
.app.light .char { color: #000; }
.pinyin { font-size: 18px; letter-spacing: 0.5px; margin-bottom: 10px; color: #111; transition: color 0.25s; pointer-events: none; }
.app.light .pinyin { color: #f4f4f4; }
.translation { font-size: 14px; color: #111; transition: color 0.25s; pointer-events: none; text-align: center; padding: 0 20px; }
.app.light .translation { color: #f4f4f4; }
.card.revealed .pinyin { color: rgba(255,255,255,0.7); }
.card.revealed .translation { color: rgba(255,255,255,0.45); }
.app.light .card.revealed .pinyin { color: rgba(0,0,0,0.6); }
.app.light .card.revealed .translation { color: rgba(0,0,0,0.38); }
.overlay-left, .overlay-right { position: absolute; inset: 0; border-radius: 20px; opacity: 0; pointer-events: none; display: flex; align-items: center; }
.overlay-left { background: #c0392b; justify-content: flex-start; padding-left: 28px; }
.overlay-right { background: #27ae60; justify-content: flex-end; padding-right: 28px; }
.overlay-icon { font-size: 32px; color: rgba(255,255,255,0.95); pointer-events: none; }
.hint { margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.18); text-align: center; }
.app.light .hint { color: rgba(0,0,0,0.18); }
.stats { margin-top: 24px; display: none; gap: 32px; }
.stat { text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; color: #fff; }
.app.light .stat-num { color: #000; }
.stat-label { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 3px; }
.app.light .stat-label { color: rgba(0,0,0,0.25); }
.stat-num.green { color: #27ae60; }
.stat-num.red { color: #c0392b; }
.stat-num.amber { color: #e67e22; }
.progress { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.06); }
.app.light .progress { background: rgba(0,0,0,0.06); }
.progress-bar { height: 100%; background: #27ae60; transition: width 0.4s; }
.done-screen { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 24px; text-align: center; }
.done-screen.visible { display: flex; }
.done-score { font-size: 24px; font-weight: 500; color: #fff; }
.app.light .done-score { color: #000; }
.done-sub { font-size: 13px; color: rgba(255,255,255,0.35); max-width: 280px; line-height: 1.6; }
.app.light .done-sub { color: rgba(0,0,0,0.35); }
.btn { margin-top: 4px; background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.65); padding: 12px 28px; border-radius: 28px; font-size: 13px; cursor: pointer; -webkit-appearance: none; }
.app.light .btn { border-color: rgba(0,0,0,0.18); color: rgba(0,0,0,0.55); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="top-bar" id="topBar" style="display:none;">
    <div class="counter" id="counter"></div>
    <div class="top-right">
      <button class="menu-btn" id="menuBtn">≡ leçons</button>
      <button class="theme-toggle" id="themeBtn">☀ clair</button>
    </div>
  </div>

  <div class="menu" id="menuScreen">
    <div class="menu-title">HSK1 Flashcards</div>
    <div class="menu-sub">Sélectionne les leçons à réviser</div>
    <div id="lessonList"></div>
    <div class="menu-footer">
      <button class="select-all-btn" id="selectAllBtn">tout sélectionner</button>
      <button class="start-btn" id="startBtn" disabled>commencer</button>
    </div>
  </div>

  <div class="game" id="gameScreen">
    <div class="card-area" id="cardArea">
      <div class="card" id="card">
        <div class="overlay-left" id="overlayLeft"><span class="overlay-icon">✕</span></div>
        <div class="overlay-right" id="overlayRight"><span class="overlay-icon">✓</span></div>
        <div class="difficulty" id="difficulty"></div>
        <div class="lesson-badge" id="lessonBadge"></div>
        <div class="char" id="char"></div>
        <div class="pinyin" id="pinyin"></div>
        <div class="translation" id="trans"></div>
      </div>
    </div>
    <div class="hint" id="hint">toucher pour révéler · glisser pour juger</div>
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-num green" id="knownEl">0</div><div class="stat-label">maîtrisés</div></div>
      <div class="stat"><div class="stat-num amber" id="deckEl">0</div><div class="stat-label">restants</div></div>
      <div class="stat"><div class="stat-num red" id="unknownEl">0</div><div class="stat-label">à revoir</div></div>
    </div>
    <div class="done-screen" id="doneScreen">
      <div style="font-size:48px;">🎉</div>
      <div class="done-score" id="doneScore"></div>
      <div class="done-sub" id="doneSub"></div>
      <button class="btn" id="restartBtn">recommencer</button>
      <button class="btn" id="reviewBtn" style="display:none;">revoir les ratés</button>
      <button class="btn" id="backBtn">changer de leçons</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'duo10_sr_v5';
let cardStates = {};
try { const s = localStorage.getItem(STORAGE_KEY); if (s) cardStates = JSON.parse(s); } catch(e) {}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates)); } catch(e) {} }
function getCS(char) { return cardStates[char] || {errors:0,seen:0,mastered:false}; }
function setCS(char, st) { cardStates[char] = st; saveState(); }

let selectedLessons = new Set();
let activeCards = [];
let deck=[], current=0, sessionKnown=0, sessionUnknown=0;
let revealed=false, isSwiping=false, touchMoved=false;
let touchStartX=0, touchStartY=0, touchCurrentX=0;

function renderMenu() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  LESSONS.forEach(l => {
    const row = document.createElement('div');
    row.className = 'lesson-row';
    const checked = selectedLessons.has(l.id);
    row.innerHTML = `
      <div class="lesson-info">
        <div class="lesson-name">${l.name} — ${l.theme}</div>
        <div class="lesson-count">${l.cards.length} mots</div>
      </div>
      <div class="checkbox ${checked?'checked':''}" id="cb_${l.id}"></div>
    `;
    row.addEventListener('click', () => toggleLesson(l.id));
    list.appendChild(row);
  });
  updateStartBtn();
}

function toggleLesson(id) {
  if (selectedLessons.has(id)) selectedLessons.delete(id);
  else selectedLessons.add(id);
  const cb = document.getElementById('cb_'+id);
  if (cb) cb.className = 'checkbox'+(selectedLessons.has(id)?' checked':'');
  updateStartBtn();
}

function updateStartBtn() {
  const btn = document.getElementById('startBtn');
  const total = [...selectedLessons].reduce((acc, id) => {
    const l = LESSONS.find(x=>x.id===id);
    return acc + (l?l.cards.length:0);
  }, 0);
  btn.disabled = selectedLessons.size === 0;
  btn.textContent = selectedLessons.size === 0 ? 'commencer' : 'commencer · '+total+' mots';
}

document.getElementById('selectAllBtn').addEventListener('click', () => {
  const allSelected = selectedLessons.size === LESSONS.length;
  if (allSelected) { selectedLessons.clear(); document.getElementById('selectAllBtn').textContent = 'tout sélectionner'; }
  else { LESSONS.forEach(l => selectedLessons.add(l.id)); document.getElementById('selectAllBtn').textContent = 'tout désélectionner'; }
  renderMenu();
});

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  activeCards = [];
  LESSONS.forEach(l => {
    if (selectedLessons.has(l.id)) l.cards.forEach(c => activeCards.push({...c, lesson: l.name+' '+l.theme}));
  });
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('topBar').style.display = 'flex';
  restart();
}

function showMenu() {
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('menuScreen').style.display = '';
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('progressBar').style.width = '0%';
  renderMenu();
}

function buildDeck() {
  const unmastered = activeCards.filter(c => !getCS(c.char).mastered);
  if (unmastered.length === 0) return [...activeCards];
  const weighted = [];
  unmastered.forEach(c => {
    const reps = Math.min((getCS(c.char).errors||0)+1, 4);
    for (let i=0;i<reps;i++) weighted.push(c);
  });
  for (let i=weighted.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [weighted[i],weighted[j]]=[weighted[j],weighted[i]];
  }
  return weighted.slice(0, Math.min(weighted.length, 25));
}

function renderDots(errors) {
  const el = document.getElementById('difficulty');
  el.innerHTML = '';
  for (let i=0;i<3;i++) {
    const d = document.createElement('div');
    d.className='dot'+(i<Math.min(errors,3)?' active':'');
    el.appendChild(d);
  }
}

function loadCard() {
  if (current >= deck.length) { showDone(); return; }
  const c = deck[current];
  const st = getCS(c.char);
  document.getElementById('char').textContent = c.char;
  document.getElementById('pinyin').textContent = c.pinyin;
  document.getElementById('trans').textContent = c.trans;
  document.getElementById('lessonBadge').textContent = c.lesson;
  const card = document.getElementById('card');
  card.classList.remove('revealed');
  card.style.transform=''; card.style.transition='';
  document.getElementById('overlayLeft').style.opacity=0;
  document.getElementById('overlayRight').style.opacity=0;
  revealed=false; isSwiping=false; touchMoved=false;
  renderDots(st.errors||0);
  const mastered=activeCards.filter(c=>getCS(c.char).mastered).length;
  document.getElementById('progressBar').style.width=Math.round(mastered/activeCards.length*100)+'%';
  document.getElementById('counter').textContent=(current+1)+' / '+deck.length;
  if (current>0){document.getElementById('stats').style.display='flex';document.getElementById('hint').style.display='none';}
  document.getElementById('knownEl').textContent=sessionKnown;
  document.getElementById('deckEl').textContent=deck.length-current;
  document.getElementById('unknownEl').textContent=sessionUnknown;
}

function swipe(dir) {
  const c=deck[current]; const st=getCS(c.char);
  st.seen=(st.seen||0)+1;
  if(dir>0){sessionKnown++;if((st.errors||0)===0&&st.seen>=2)st.mastered=true;else if((st.errors||0)>0)st.errors=Math.max(0,st.errors-1);}
  else{sessionUnknown++;st.errors=(st.errors||0)+1;st.mastered=false;}
  setCS(c.char,st);
  const card=document.getElementById('card');
  card.style.transition='transform 0.28s ease';
  card.style.transform='translateX('+(dir>0?700:-700)+'px) rotate('+(dir*10)+'deg)';
  current++; setTimeout(loadCard,290);
}

function showDone() {
  document.getElementById('cardArea').style.display='none';
  document.getElementById('stats').style.display='none';
  document.getElementById('hint').style.display='none';
  const mastered=activeCards.filter(c=>getCS(c.char).mastered).length;
  document.getElementById('doneScore').textContent=mastered+' / '+activeCards.length+' maîtrisés';
  const toReview=activeCards.filter(c=>(getCS(c.char).errors||0)>0).length;
  document.getElementById('doneSub').textContent=toReview>0?toReview+' carte(s) prioritaires à la prochaine session.':'Excellent ! Revenez demain pour consolider.';
  document.getElementById('reviewBtn').style.display=toReview>0?'':'none';
  document.getElementById('doneScreen').classList.add('visible');
}

function restart() {
  current=0;sessionKnown=0;sessionUnknown=0;revealed=false;
  deck=buildDeck();
  document.getElementById('cardArea').style.display='';
  document.getElementById('hint').style.display='';
  document.getElementById('stats').style.display='none';
  document.getElementById('doneScreen').classList.remove('visible');
  loadCard();
}

const card=document.getElementById('card');
card.addEventListener('touchstart',function(e){
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
  touchCurrentX=touchStartX;isSwiping=false;touchMoved=false;
},{passive:true});
card.addEventListener('touchmove',function(e){
  e.preventDefault();
  const dx=e.touches[0].clientX-touchStartX;
  const dy=e.touches[0].clientY-touchStartY;
  touchCurrentX=e.touches[0].clientX;
  if(Math.abs(dx)>8||Math.abs(dy)>8)touchMoved=true;
  if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))isSwiping=true;
  if(!isSwiping)return;
  card.style.transition='none';
  card.style.transform='translateX('+dx+'px) rotate('+(dx*0.04)+'deg)';
  const pct=Math.min(Math.abs(dx)/90,1);
  document.getElementById(dx<0?'overlayLeft':'overlayRight').style.opacity=pct*0.9;
  document.getElementById(dx<0?'overlayRight':'overlayLeft').style.opacity=0;
},{passive:false});
card.addEventListener('touchend',function(){
  const dx=touchCurrentX-touchStartX;
  if(!touchMoved){revealed=!revealed;card.classList.toggle('revealed',revealed);return;}
  if(isSwiping&&Math.abs(dx)>90)swipe(dx>0?1:-1);
  else{card.style.transition='transform 0.2s';card.style.transform='';document.getElementById('overlayLeft').style.opacity=0;document.getElementById('overlayRight').style.opacity=0;}
  isSwiping=false;touchMoved=false;
},{passive:true});

document.getElementById('themeBtn').addEventListener('click',function(){
  document.getElementById('app').classList.toggle('light');
  this.textContent=document.getElementById('app').classList.contains('light')?'● sombre':'☀ clair';
});
document.getElementById('menuBtn').addEventListener('click',showMenu);
document.getElementById('restartBtn').addEventListener('click',restart);
document.getElementById('reviewBtn').addEventListener('click',restart);
document.getElementById('backBtn').addEventListener('click',showMenu);

renderMenu();
</script>
</body>
